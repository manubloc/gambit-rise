# Die EISERNE KETTE, so weit sie ein Runner tragen kann (31 Suiten / 2720
# Pruefungen, Stand v1.90.25 - siehe CLAUDE.md).
#
# ── v1.90.16 (Audit A69): OHNE ARCHIV, OHNE 700-MB-UPLOAD ───────────────
# Der Bau lief hier mit den drei Archivordnern der Schaukammer (743 MB dist/)
# und lud das GANZE dist/ als Artefakt hoch - bei jedem Push. Geprueft wird
# hier, ob das Spiel baut und laeuft; die Originale der Schaukammer braucht
# dafuer niemand (lokal gilt weiter: echter Release OHNE den Schalter). Das
# Einzeldatei-Artefakt bleibt, drei Tage lang.
#
# ── v1.90.11 (Audit A27): WAS DIESE DATEI NICHT KANN ────────────────────
# Sie sperrt den Deploy NICHT. Cloudflare Pages baut bei JEDEM Push auf main
# und fragt das Ergebnis dieses Laufs nicht ab - eine rote Kette haelt nichts
# auf. Der Lauf ist ein Netz unter der Handarbeit, kein Tor davor.
# Bis v1.90.10 lief hier nur ein TEIL der Kette: test_boot.mjs, build:app und
# beide Fahrproben fehlten - also genau die Proben, die Abstuerze im
# laufenden Spiel finden. Jetzt laeuft alles, was ohne den Cloud-Container
# geht; der Chromium kommt vom Runner selbst (PW_CHROMIUM, sonst greift der
# fest verdrahtete Containerpfad ins Leere).
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # test_zauber misst die Sockelfarbe des Drachen IM BILD, mit python3 +
      # Pillow. Lokal ist Pillow da, auf dem Runner nicht - daran ist die CI
      # seit v1.1.9 gescheitert, 52 Laeufe lang, waehrend lokal alles gruen
      # blieb. Die Probe wird NICHT uebersprungen: sie soll auch hier messen.
      # pruefe-sperrsitz misst am selben Weg (Alphakanal statt Farbe).
      - name: Pillow fuer die Bildmessung
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      # Die Fahrproben brauchen einen echten Browser. Im Cloud-Container liegt
      # er unter /opt/pw-browsers; hier holt ihn playwright-core selbst und
      # sagt uns den Pfad, den die Proben ueber PW_CHROMIUM lesen.
      - name: Chromium fuer die Fahrproben
        run: |
          npx playwright-core install --with-deps chromium
          echo "PW_CHROMIUM=$(node -e "import('playwright-core').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
        env: { OHNE_ARCHIV: "1" }
      # v1.90.19: drive3 EINMAL im Auslieferungsstand (Landingpage an der
      # Wurzel, App unter /spielen/): nur hier prueft es die Startseite, den
      # abmeldenden Dienstarbeiter und den CSP-Kopf in dist/_headers samt
      # passender Hashes. Nach build:app sieht es nur noch die App.
      - run: timeout 250 node drive3.mjs
      # build:app stellt die App an die Wurzel von dist/ zurueck - ohne diesen
      # Schritt meldet drive3 vier Fehler, die es nicht gibt (die Landingpage
      # hat kein Brett). Teuer gelernt in v1.86.0, siehe CLAUDE.md.
      - run: npm run build:app
        env: { OHNE_ARCHIV: "1" }
      - run: npm run build:single
      - run: node test_boot.mjs
      - run: node scripts/verify-boot.mjs
      - run: node tools/pruefe-sperrsitz.mjs
      - run: timeout 250 node drive3.mjs
      - run: node tools/pruefe-navigation.mjs
      # v1.90.16: jede Figur jeder Schluesselstation auf dem echten Brett
      # vermessen (Bandbreite, Mitte, Linie, Fuss) - siehe CLAUDE.md.
      - run: node tools/pruefe-figurenmass.mjs
      # v1.90.18 (Audit A73): zwei App-Seiten spielen ein Online-Duell gegen
      # die echte Hallen-Logik (routeWebSocket, kein Netz) - siehe CLAUDE.md
      - run: node tools/pruefe-duell.mjs
      - run: node tools/pruefe-leiste.mjs
      - run: node tools/pruefe-brettruhe.mjs
      - run: node tools/pruefe-hofzoom.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gambit-rise-singlefile
          path: dist-single/index.html
          retention-days: 3
