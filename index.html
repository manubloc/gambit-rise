    <script>
    /* THE WATCHDOG — insurance against the stuck-cache death spiral: if the
       boot note is still on screen 6s after load (the app never mounted),
       this page CANNOT heal itself through the normal update path. So we do
       it the hard way, ONCE: unregister every service worker, wipe every
       cache, reload fresh from the network. A sessionStorage latch prevents
       any loop. Healthy loads remove #gg-boot instantly — this never fires. */
    (function () {
      try {
        var KEY = "gg-watchdog";
        window.addEventListener("load", function () {
          setTimeout(function () {
            var boot = document.getElementById("gg-boot");
            if (!boot || !document.body.contains(boot)) return;      // mounted: all is well
            if (sessionStorage.getItem(KEY)) return;                 // already tried once
            sessionStorage.setItem(KEY, "1");
            var go = function () { location.reload(); };
            Promise.resolve()
              .then(function () { return ("serviceWorker" in navigator) ? navigator.serviceWorker.getRegistrations() : []; })
              .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
              .then(function () { return ("caches" in window) ? caches.keys() : []; })
              .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
              .then(go, go);
          }, 6000);
        });
      } catch (e) {}
    })();
  </script>

  <body>
    <!-- LADESCHIRM: steht vor jedem Skript und muss deshalb ohne JavaScript
         auskommen - das Zeichen des Risses auf Schwarz, umringt von Funken,
         die aus ihm steigen. Reines CSS, keine Abhaengigkeit, kein Bundle. -->
    <style>
      /* Bevor das Bundle da ist, gilt noch der Standard des Browsers: weisser
         Grund und 8px Rand am body - beim Laden blitzt das als heller Rahmen
         auf. Deshalb hier, vor allem anderen, Schwarz ohne Rand. */
      html, body { margin:0; padding:0; background:#000; }
      @keyframes ggBootAtem { 0%,100% { transform:scale(1) translateZ(0); }
        50% { transform:scale(1.035) translateZ(0); } }
      @keyframes ggBootKreis { from { transform:rotate(0deg) translateZ(0); } to { transform:rotate(360deg) translateZ(0); } }
      @keyframes ggBootTangente { 0% { transform:translate3d(0,0,0) scale(.5); opacity:0; }
        12% { opacity:1; } 100% { transform:translate3d(var(--tx),var(--ty),0) scale(1); opacity:0; } }
      @keyframes ggBootFunke { 0% { transform:translate(0,0) scale(.4); opacity:0; }
        18% { opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(1); opacity:0; } }
      @keyframes ggBootWort { from { opacity:0; letter-spacing:.5em; } to { opacity:1; letter-spacing:.26em; } }
      .gg-funke { position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%;
        background:#c4b5fd; box-shadow:0 0 8px 2px rgba(139,92,246,.85);
        animation:ggBootFunke var(--d) ease-out var(--t) infinite; }
    </style>
    <div id="root"><div id="gg-boot" style="font-family:Georgia,serif;color:#f2d98c;background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">
      <div>
        <div style="position:relative;width:min(58vw,208px);height:min(58vw,208px);margin:0 auto 26px">
          <div class="gg-funke" style="--dx:-64px;--dy:-72px;--d:2.6s;--t:0s"></div>
          <div class="gg-funke" style="--dx:70px;--dy:-58px;--d:3.1s;--t:.35s"></div>
          <div class="gg-funke" style="--dx:-78px;--dy:44px;--d:2.9s;--t:.7s"></div>
          <div class="gg-funke" style="--dx:58px;--dy:76px;--d:3.4s;--t:1.05s"></div>
          <div class="gg-funke" style="--dx:-30px;--dy:-90px;--d:2.4s;--t:1.4s"></div>
          <div class="gg-funke" style="--dx:88px;--dy:12px;--d:3.2s;--t:1.75s"></div>
          <div class="gg-funke" style="--dx:-90px;--dy:-8px;--d:2.8s;--t:2.1s"></div>
          <div class="gg-funke" style="--dx:22px;--dy:-92px;--d:3.0s;--t:2.45s"></div>
          <!-- DER SCHWEIF DES RISSES: ein violetter Komet umrundet das Zeichen
               in 1,5 Sekunden und verliert TANGENTIAL Funken - jeder Funke
               startet auf der Kreisbahn und fliegt in Laufrichtung davon.
               v0.82 (Besitzer): Die Bahn lag 7 % AUSSERHALB der Kontur, der
               Schweif war 64 px lang - zusammen las sich das als starrer
               Strich um das Zeichen. Jetzt laeuft der Komet DICHT AN DER
               KONTUR (inset 3 %), sein Schweif ist auf 34 px verkuerzt und
               duenner, und statt vier fliegen SIEBEN Funken tangential weg -
               unterschiedlich weit, als schleudere die Fliehkraft sie fort. -->
          <div style="position:absolute;inset:3%;animation:ggBootKreis 1.5s linear infinite;will-change:transform;transform:translateZ(0)">
            <div style="position:absolute;left:50%;top:0;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
              background:radial-gradient(circle,#efe8ff 0%,#a78bfa 45%,transparent 75%);
              box-shadow:0 0 9px 3px rgba(139,92,246,.9),0 0 20px 7px rgba(124,58,237,.4)"></div>
            <div style="position:absolute;left:50%;top:1.5px;width:34px;height:5px;margin-left:-34px;border-radius:99px;
              background:linear-gradient(90deg,transparent 0%,rgba(124,58,237,.28) 45%,rgba(196,181,253,.9) 100%);
              filter:blur(1.2px)"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:44px;--ty:-12px;animation:ggBootTangente 1.1s ease-out 0s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:34px;--ty:-24px;animation:ggBootTangente 1.3s ease-out .22s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:56px;--ty:-3px;animation:ggBootTangente 1.2s ease-out .44s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:28px;--ty:-30px;animation:ggBootTangente 1.45s ease-out .66s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:66px;--ty:-16px;animation:ggBootTangente 1.6s ease-out .88s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:38px;--ty:6px;animation:ggBootTangente 1.25s ease-out 1.1s infinite"></div>
            <div class="gg-funke" style="left:50%;top:2px;--tx:50px;--ty:-34px;animation:ggBootTangente 1.7s ease-out 1.32s infinite"></div>
          </div>
          <img src="./icons/boot-riss.webp" alt="Grand Gambit" width="208" height="208"
            style="position:relative;width:100%;height:100%;display:block;animation:ggBootAtem 3.2s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(139,92,246,.6));will-change:transform" />
        </div>
        <div style="font-size:clamp(17px,4.6vw,23px);letter-spacing:.26em;animation:ggBootWort 1.1s ease-out both">GRAND GAMBIT</div>
        <div style="font-size:13px;color:#8b7fb0;margin-top:11px;max-width:420px;line-height:1.5">Wird geladen …</div>
      </div>
    </div></div>
